name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      ASDF_DIR: ${{ github.workspace }}/.asdf
      ASDF_DATA_DIR: ${{ github.workspace }}/.asdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup asdf
        run: |
          set -e
          git clone --depth 1 --branch v0.20.0 https://github.com/asdf-vm/asdf.git ${{ env.ASDF_DIR }}
          echo "${{ env.ASDF_DIR }}/bin" >> $GITHUB_PATH
          echo "${{ env.ASDF_DIR }}/shims" >> $GITHUB_PATH

      - name: Add herdr plugin
        run: asdf plugin add herdr https://github.com/RobLoach/asdf-herdr

      - name: Install herdr latest
        run: asdf install herdr latest

      - name: Verify herdr
        run: herdr --version
