name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install asdf
        uses: asdf-vm/actions/install@v4

      - name: Add herdr plugin
        run: asdf plugin add herdr https://github.com/ogulcancelik/herdr

      - name: Install herdr latest
        run: asdf install herdr latest

      - name: Verify herdr
        run: herdr --version
