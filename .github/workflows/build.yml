name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      ASDF_DIR: ${{ github.workspace }}/.asdf
      ASDF_DATA_DIR: ${{ github.workspace }}/.asdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download asdf binary
        run: |
          set -e
          curl -sSL https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'X64' && 'amd64' || 'arm64' }}.tar.gz -o asdf.tar.gz
          tar -xzf asdf.tar.gz
          chmod +x asdf
          mv asdf ${{ env.ASDF_DIR }}/bin/asdf

      - name: Setup asdf
        run: |
          echo "${{ env.ASDF_DIR }}/bin" >> $GITHUB_PATH
          echo "${{ env.ASDF_DIR }}/shims" >> $GITHUB_PATH
          ${{ env.ASDF_DIR }}/bin/asdf --version

      - name: Add herdr plugin
        run: asdf plugin add herdr https://github.com/RobLoach/asdf-herdr

      - name: Install herdr latest
        run: asdf install herdr latest

      - name: Verify herdr
        run: herdr --version
