name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: asdf plugin test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          command: "herdr --version"
          asdf_version: "0.19.0"
