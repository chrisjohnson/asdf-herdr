name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck --shell=bash --external-sources --source-path=SCRIPTDIR bin/* lib/*

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.6.23
        with:
          args: -color

  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin.toml exists
        run: test -f plugin.toml
      - name: Check bin scripts are executable
        run: |
          for script in bin/*; do
            if [ -f "$script" ] && [[ ! "$script" == *.yml ]]; then
              test -x "$script" || exit 1
            fi
          done
      - name: Validate TOML syntax
        run: |
          if command -v python3 &>/dev/null; then
            python3 -c "import tomllib; tomllib.load(open('plugin.toml', 'rb'))"
          fi
